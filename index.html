  <!--
    The page is pre-rendered at build time (scripts/prerender.tsx), so its markup is in the
    served HTML. Three things in that markup only resolve once JavaScript runs, though:
    Framer Motion's entrance states (opacity/transform/clip-path) never animate away, the
    boot overlay never dismisses, and CustomCursor never draws the pointer that index.css
    hides. Without this block a no-JS visitor gets a blank overlay and no cursor.
  -->
  <noscript>
    <style>
      #root *:not(.sr-only) {
        opacity: 1 !important;
        transform: none !important;
        clip-path: none !important;
      }

      [data-preloader] {
        display: none !important;
      }

      /* index.css is linked after this block, so its own `cursor: none !important`
         would otherwise win on an equal-specificity tie. `html:root` outweighs it. */
      @media (pointer: fine) {
        html:root, html:root body, html:root * {
          cursor: auto !important;
        }
      }
    </style>
  </noscript>

  <!--
    Structured Data (JSON-LD).

    identity and employment facts, and each project is its own node so search engines can
    describe the work rather than guess at it.

    omitting the markup.
  -->
