  <!--
    Structured Data (JSON-LD).

    A @graph of linked nodes rather than one object: ProfilePage marks this as a page *about*
    a person (which is what Google wants for a personal portfolio), Person carries the
    identity and employment facts, and each project is its own node so search engines can
    describe the work rather than guess at it.

    Keep the facts here in step with the visible copy — contradicting the page is worse than
    omitting the markup.
  -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "ProfilePage",

        },
